name: 简体中文菜单
on:
  workflow_dispatch:
  push:
    branches: [master, zh-cn-menu]
    paths:
      - 'localization/**'
      - '.github/workflows/zh-cn-menu.yml'
      - 'ExileCore.dll'
      - 'Hexa.NET.ImGui.dll'
      - 'MenuZhCN.dll'
      - 'ReadMe.md'
      - 'Plugins/Compiled/**/*.dll'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # Original English distribution from upstream v330.10.
          ref: 8208ad22f3f1ee13244d02a80002052de12a9ce2
          path: upstream-input
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: 生成简体中文版并验证设置菜单
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'ExileApi-zh-CN'
          $base = Join-Path $env:RUNNER_TEMP 'upstream.zip'
          $english = Join-Path $pwd 'upstream-input'
          git -C $english archive -o $base HEAD -- . ':(exclude).github' ':(exclude).gitignore' ':(exclude).gitmodules'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive $base $package
          Copy-Item ReadMe.md $package -Force
          dotnet run --project localization/build -c Release -- "$pwd" $package --source $english
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $old = Join-Path $env:RUNNER_TEMP 'original-favorites.json'
          $new = Join-Path $env:RUNNER_TEMP 'localized-favorites.json'
          $map = Join-Path $env:RUNNER_TEMP 'favorite-map.json'
          dotnet run --no-build --project localization/build -c Release -- "$pwd" $english --index $old
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build --project localization/build -c Release -- "$pwd" $package --localized-index $new
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build --project localization/build -c Release -- "$pwd" $package --pair $old $new $map
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build localization/favorites -c Release "-p:FavoriteMap=$map" -o "$env:RUNNER_TEMP/favorite-converter"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/favorite-converter/MenuZhCN.dll" $package
          dotnet run --no-build --project localization/build -c Release -- "$pwd" $package --verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ExileApi-zh-CN
          path: ${{ runner.temp }}/ExileApi-zh-CN/
          if-no-files-found: error
